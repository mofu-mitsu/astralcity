<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Cosmic Circle Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Celestial Orbit Ring -->
  <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(-25 50 50)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.7"/>

  <!-- Enneagram Geometry Inner Triangle -->
  <polygon points="50,16 78,68 22,68" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="50,84 22,32 78,32" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Core Pulsing Star / Planet Symbol -->
  <circle cx="50" cy="50" r="8" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>

  <!-- Orbital Tiny Planets / Constellation Nodes -->
  <circle cx="50" cy="16" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="78" cy="68" r="3" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="22" cy="68" r="3" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="76" cy="38" r="2" fill="#38bdf8"/>
  <circle cx="24" cy="38" r="2" fill="#38bdf8"/>

  <!-- Subtle Crosshairs -->
  <line x1="50" y1="6" x2="50" y2="12" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="94" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="6" y1="50" x2="12" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="88" y1="50" x2="94" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
</svg>
